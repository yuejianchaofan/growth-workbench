<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fdfbf7" />
<title>成长工作台</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root{
    --cream:#fdfbf7;
    --cream-warm:#f9f5ee;
    --cream-soft:#f3eddE;
    --cream-line:#ebe4d8;
    --cream-text:#a89f8e;
    --green-50:#eef6ef;
    --green-100:#ddf0de;
    --green-200:#c2e4c5;
    --green-300:#95d49a;
    --green-500:#3cb872;
    --green-600:#2a9d5b;
    --green-700:#1e7a45;
    --grad:linear-gradient(135deg,#a8dba8 0%,#52bd7a 55%,#2a9d5b 100%);
    --grad-soft:linear-gradient(135deg,#f0f7f0 0%,#e0f2e1 100%);
    --ink:#2a2622;
    --muted:#8a8278;
    --line:var(--cream-line);
    --card:#ffffff;
    --bg:var(--cream);
    --shadow:0 2px 14px rgba(42,38,34,.06);
    --shadow-lg:0 10px 30px rgba(42,38,34,.10);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.5;
  }
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:248px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:22px 16px;gap:6px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 12px;}
  .logo{
    width:50px;height:50px;border-radius:15px;display:block;
    box-shadow:var(--shadow-lg);object-fit:cover;
  }
  .brand b{font-size:11.5px;font-weight:500;letter-spacing:.5px;color:#46564d;}
  .brand span{font-size:12px;color:var(--muted);letter-spacing:4px;}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;
    color:var(--ink);font-size:15.5px;cursor:pointer;transition:.18s;user-select:none;
    border:1px solid transparent;
  }
  .nav-item .emoji{font-size:19px;width:22px;text-align:center;}
  .nav-item:hover{background:var(--green-50);}
  .nav-item.active{background:var(--green-100);color:var(--green-700);font-weight:600;border-color:var(--green-200);}
  .nav-item.active::before{content:"";position:absolute;}
  .nav-sep{height:1px;background:var(--line);margin:10px 6px;}
  .nav-tag{font-size:11px;color:var(--muted);padding:0 14px;letter-spacing:1px;}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;align-items:center;gap:12px;padding:15px 22px;
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:5;
  }
  .menu-btn{display:none;font-size:20px;background:none;border:none;cursor:pointer;color:var(--ink);}
  .topbar h1{font-size:18px;font-weight:700;letter-spacing:.5px;}
  .topbar .date{margin-left:auto;font-size:13px;color:var(--muted);}
  .content{padding:20px 22px 50px;max-width:920px;width:100%;margin:0 auto;}

  /* Home dashboard */
  .greet{font-size:22px;font-weight:700;margin-bottom:14px;line-height:1.5;letter-spacing:.5px;}
  .greet small{display:block;font-size:13.5px;font-weight:400;color:var(--muted);margin-top:8px;letter-spacing:.5px;line-height:1.6;}
  .greet small b{color:var(--green-600);font-weight:700;}
  .greet .enc{display:block;font-size:13px;color:var(--muted);margin-top:12px;font-weight:400;letter-spacing:.5px;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0;}
  .stat{background:var(--card);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);}
  .stat .n{font-size:22px;font-weight:800;color:var(--green-600);}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .card.grad{background:var(--grad);color:#fff;box-shadow:var(--shadow-lg);}
  .card.grad .sub{color:rgba(255,255,255,.85);}
  .card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .card.grad h3{color:#fff;}

  .focus-item,.inbox-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
    background:var(--green-50);margin-bottom:6px;font-size:14.5px;
  }
  .focus-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--green-600);}
  .focus-item.done span{text-decoration:line-through;color:var(--muted);}
  .focus-item .del,.inbox-item .del{margin-left:auto;color:var(--muted);cursor:pointer;font-size:17px;border:none;background:none;}

  .add-row{display:flex;gap:8px;margin-top:6px;}
  .add-row input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;
    outline:none;background:var(--bg);transition:.18s;
  }
  .add-row input:focus{border-color:var(--green-300);background:#fff;}
  .btn{
    border:none;background:var(--grad);color:#fff;font-weight:600;font-size:14px;
    padding:10px 16px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow);transition:.18s;white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#fff;color:var(--green-700);border:1px solid var(--green-200);box-shadow:none;}

  .module-desc{color:var(--muted);font-size:13.5px;margin:2px 0 14px;line-height:1.5;}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 0;}
  .module-stat{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .bar{height:8px;background:rgba(255,255,255,.45);border-radius:6px;margin-top:12px;overflow:hidden;}
  .bar-fill{height:100%;background:#fff;border-radius:6px;transition:width .4s;}
  .rev-form{display:flex;flex-direction:column;gap:3px;}
  .rev-form label{font-size:13px;color:var(--green-700);font-weight:600;margin-top:6px;}
  .rev-form textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;resize:vertical;min-height:46px;background:var(--bg);}
  .rev-form textarea:focus{border-color:var(--green-300);background:#fff;}
  .rev-item{border-left:3px solid var(--green-300);padding:7px 11px;margin-bottom:10px;background:var(--green-50);border-radius:0 10px 10px 0;}
  .rev-date{font-size:12.5px;color:var(--muted);margin-bottom:3px;}
  .rev-line{font-size:14px;margin:2px 0;}
  .rev-line b{color:var(--green-700);margin-right:6px;font-weight:600;}
  .good-item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .rev-body{flex:1 1 auto;min-width:0;}
  .good-actions{display:flex;gap:5px;flex:0 0 auto;margin-top:2px;}
  .rev-icon{font-size:16px;background:#fff;border:1px solid var(--green-300);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;}
  .rev-icon:active{background:var(--green-50);}
  .rev-icon.del{border-color:#fca5a5;color:#dc2626;}
  .rev-icon.del:active{background:#fef2f2;}
  .idea-month{margin-bottom:18px;}
  .idea-month-title{font-size:14px;font-weight:600;color:var(--green-800);margin-bottom:8px;}
  .idea-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:11.5px;color:var(--muted);text-align:center;}
  .idea-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px;}
  .idea-cell{aspect-ratio:1;border-radius:8px;background:#f0ede4;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);transition:all .15s;}
  .idea-cell.on{background:linear-gradient(135deg,#86c48c,#5aaf66);color:#fff;font-weight:600;}
  .idea-cell.today{outline:2px solid var(--green-600);outline-offset:-1px;color:var(--green-700);}
  .idea-cell.empty{background:transparent;cursor:default;pointer-events:none;}
  .idea-cell:active{transform:scale(.9);}

  /* 新增组件 */
  .pbar{height:7px;background:var(--green-100);border-radius:6px;overflow:hidden;margin-top:8px;}
  .pbar-fill{height:100%;background:var(--grad);border-radius:6px;transition:width .4s;}
  .metric-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px;}
  .metric-row.c3{grid-template-columns:repeat(3,1fr);gap:8px;}
  .metric-row.c3 .metric{padding:12px 10px;}
  .metric-row.c3 .metric .n{font-size:18px;}
  .metric{background:var(--green-50);border-radius:12px;padding:12px 14px;}
  .metric .n{font-size:19px;font-weight:800;color:var(--green-600);line-height:1.2;}
  .metric .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .data-actions{display:flex;gap:10px;flex-wrap:wrap;}
  @media(max-width:560px){.two-col{grid-template-columns:1fr;}}

  /* 每日简报 — 胶囊标签 */
  .brief-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
  .brief-pill{
    display:inline-flex;align-items:center;padding:5px 13px;border-radius:15px;
    font-size:12.5px;font-weight:500;transition:.15s;cursor:default;line-height:1.4;
  }
  .brief-pill.done{background:var(--green-100);color:var(--green-700);border:1px solid var(--green-200);}
  .brief-pill.pending{background:#f5f2ed;color:var(--muted);border:1px solid var(--cream-line);}
  .brief-pill.part{background:#fef9e7;color:#b08d00;border:1px solid #f0e6c0;}
  .fold-toggle{text-align:center;padding:8px 0;font-size:13px;color:var(--green-600);font-weight:600;cursor:pointer;letter-spacing:.3px;}

  /* AI 学习：资讯 / 技巧 */
  .news-item{padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5;}
  .news-item:last-child{border-bottom:none;}
  .news-item .src{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;}
  .tip-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5;}
  .tip-item:last-child{border-bottom:none;}
  .tip-item .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .study-check{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 14px;border-radius:10px;background:var(--green-100);color:var(--green-700);font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;}
  .study-check input{width:16px;height:16px;accent-color:var(--green-600);}

  /* Mobile drawer */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;}
  .overlay.show{display:block;}
  @media(max-width:760px){
    .sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg);}
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:block;}
    .topbar{padding:16px 18px;}
    .content{padding:18px 16px 50px;}
    .stat-row{grid-template-columns:1fr 1fr;}
    .greet{font-size:20px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="阅见" />
      <b>成长工作台</b>
    </div>
    <div class="nav" id="nav"></div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h1 id="pageTitle">首页</h1>
      <div class="date" id="topDate"></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<script>
/* ===== 模块定义 ===== */
const MODULES = [
  {id:'home',  name:'首页',       emoji:'🏠', special:true},
  {id:'read',  name:'读书计划',   emoji:'📚', desc:'十年读书之约：每年52本，今年第一年。读完一本记一本，不追数量，只留真读过的。'},
  {id:'ai',    name:'AI学习',     emoji:'🤖', desc:'跟北辰学思维模型与工具。把学到的方法落进生活。'},
  {id:'doc',   name:'纪录片开眼', emoji:'🎬', desc:'用纪录片打开眼界。看过就记，留一句收获。'},
  {id:'sport', name:'运动打卡',   emoji:'🏃', desc:'每日一万步 + 站桩30分钟。把身体当成修心的道场。'},
  {id:'idea',  name:'灵感瞬间',   emoji:'💡', desc:'脑子里的火花一秒捕获，别让它溜走。'},
  {id:'good',  name:'日行一善',   emoji:'🌱', desc:'日行一善，胜过读万卷书。每天一件小事。'},
  {id:'mood',  name:'心情日记',   emoji:'🌤️', desc:'每天三件开心的事，回看能看见生活待你不薄。'},
  {id:'review',name:'每日复盘',   emoji:'🔄', desc:'先看清今天做了啥、没做啥，再想为啥、怎么改。'},
];

/* ===== AI 学习：每日资讯源（由每日自动任务刷新） ===== */
const AI_NEWS = [
  {t:'科技巨头想要收集你的思想', s:'Solidot'},
  {t:'图书零售商怀疑 AI 公司购买然后销毁珍本图书', s:'Solidot'},
  {t:'Google 重组 AI 部门旨在赶上竞争对手', s:'Solidot'},
];
const WB_TIPS = [
  '导出备份与导入还原：首页「数据安全」卡片点「导出备份」，把全部本地记录打包成 JSON 文件；换设备或清缓存后用「导入备份」一键恢复，数据不丢。',
  '文件直接拖进对话框：把截图、PDF、表格或代码文件拖到聊天窗口，WorkBuddy 会实时读取并分析，也支持看图和读文档，比复制粘贴省事得多。',
  '专家中心与加到主屏幕：左侧「专家」入口进专家中心，按类别找到 100 多位领域专家点开即聊；手机用 Chrome 菜单「安装应用」把工作台钉到主屏幕，全屏无地址栏，体验像原生 App。',
  '一言不合就搜图：对话中说「帮我搜一张XX的图片」，WorkBuddy 直接调出搜索结果，不切窗口、不另开 App。',
  '语音输入解放手指：手机端输入框旁边点麦克风，说一段话自动转文字，写长内容比打字快三倍。',
  '对话分段不混乱：每聊一个话题新开一个对话，避免上下文越滚越乱、AI 张冠李戴。闲聊开一个，写作开一个，代码开一个。',
  '关注内存限制：单次对话有字数上限，太长的文档建议拆成几段分批发，AI 每段都能聚焦处理。',
  '善用技能商店：左侧「技能」里搜你需要的，比如「视频号拆解」「思维导图」「去 AI 味」，一键加载就能用。',
  '让 AI 帮你读链接：把微信公众号文章、小红书笔记链接直接发给 WorkBuddy，它会读取全文后帮你总结要点。',
  '多模态随便切：同一个对话框里可以发文字、图片、文件、链接，WorkBuddy 自动识别类型并分别处理。',
  '懒人指令：输入 / 符号会弹出常用命令菜单，比如 /commit 提交代码、/review 审查代码，不用记命令。',
  '追问才是核心能力：AI 第一次给的答案一般不是最好的，追问 3 轮以上才能逼近你真正想要的。好答案是一起改出来的。',
  '设定角色提效十倍：开头说「你是一位有十年经验的XX专家」，AI 输出的质量和针对性立刻上一个台阶。',
  '导出对话记录：对话右上角菜单里有「导出」选项，可以把聊天记录存成文件备份或发给别人看。',
  '用 AI 做决策辅助，不做执行替身：让它列利弊、找漏洞、出备选方案很好用，但最终拍板和实际操作必须自己来。'
];
const AI_PROMPTS = [
  {t:'对比分析框架', d:'「请对比公众号和视频号两个平台做读书内容的优劣势，从受众、变现、复利效应、内容门槛四个维度各自打分，满分 10 分。」让 AI 给你一张决策表而非一段废话。', c:'说「打分」，AI 会多一个维度思考。'},
  {t:'多视角辩论', d:'「就「AI 会不会取代人类创造力」这个话题，同时模仿艺术家、工程师、哲学家三个人的立场各自写一段。语气要像真人在吵。」观点在碰撞中成形。', c:'一个人想不明白的事，让三个 AI 吵一架。'},
  {t:'分步拆解法', d:'「我想整理这周读书笔记。第一步把 5 条划线按主题归类；第二步给每类写一句核心；第三步合成一段朋友圈文案。每步做完等我说继续。」大任务切成小步，边做边改。', c:'别一次要终稿，让 AI 陪你一步步走。'},
];

/* 每日轮换：从数组中按日期抽取 count 项，实现不用后台自动化的"每日刷新"效果 */
function pickDaily(arr, count) {
  const days = Math.floor(Date.now() / 86400000);
  const start = (days * count) % arr.length;
  const out = [];
  for (let i = 0; i < count; i++) out.push(arr[(start + i) % arr.length]);
  return out;
}

/* ===== 存储 ===== */
const KEY = id => 'gw_' + id;
function load(id){ try{ return JSON.parse(localStorage.getItem(KEY(id))) || []; }catch(e){ return []; } }
function save(id, arr){ localStorage.setItem(KEY(id), JSON.stringify(arr)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* 日行一善基准：app 启用前的既有累计，注入后叠加新记录 */
const BASE_TRASH = 37;  // 启用前已捡垃圾 37 包
const BASE_BURY  = 13;  // 启用前已埋动物 13 只

/* ===== 工具 ===== */
function todayStr(){ const d=new Date(); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function weekday(){ const w=['星期日','星期一','星期二','星期三','星期四','星期五','星期六']; return w[new Date().getDay()]; }
function greet(){ const h=new Date().getHours(); if(h<6)return'夜深了'; if(h<12)return'早上好'; if(h<14)return'中午好'; if(h<18)return'下午好'; return'晚上好'; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===== 汇总统计 ===== */
function totals(){
  let todo=0, total=0, active=0;
  MODULES.filter(m=>!m.special && !['review','sport','readtime','readnote'].includes(m.id)).forEach(m=>{
    const arr=load(m.id);
    total+=arr.length;
    if(arr.length) active++;
    todo+=arr.filter(x=>!x.done).length;
  });
  return {todo,total,active};
}

/* ===== 渲染：首页（每日简报） ===== */
function dailyBriefing(){
  const inbox=load('inbox');
  const todaySport=load('sport').find(x=>x.date===ymd());
  const todayRead=load('readtime').find(x=>x.date===ymd());
  const todayReview=load('review').find(x=>x.date===ymd());
  const todayMood=load('mood').find(x=>x.date===ymd());
  const todayGood=load('good').find(x=>x.date===ymd());

  function statusLabel(m){
    if(m.id==='sport'){
      if(!todaySport) return 'pending';
      const s=(+todaySport.steps||0)>=10000, st=(+todaySport.stand||0)>=30;
      return (s&&st) ? 'done' : 'part';
    }
    if(m.id==='read') return todayRead ? 'done' : 'pending';
    if(m.id==='review') return todayReview ? 'done' : 'pending';
    if(m.id==='mood') return todayMood ? 'done' : 'pending';
    if(m.id==='good') return todayGood ? 'done' : 'pending';
    if(m.id==='ai'){ const s=aiStudy(); const n=(s.news?1:0)+(s.tips?1:0)+(s.prompts?1:0); return n===0?'pending':(n===3?'done':'part'); }
    if(m.id==='doc'){ const s=docStudy(); return s.watched ? 'done' : 'pending'; }
    if(m.id==='idea'){ const d=load('idea_days'); return (d||[]).includes(ymd()) ? 'done' : 'pending'; }
    return 'pending';
  }

  const mods = MODULES.filter(m=>!m.special);
  const doneMods = [], pendingMods = [];
  mods.forEach(m=>{
    const st=statusLabel(m);
    const pill = `<span class="brief-pill ${st}">${esc(m.name)}</span>`;
    if(st==='done') doneMods.push(pill); else pendingMods.push(pill);
  });

  const daysLeft = daysToYearEnd();
  const doneCount = doneMods.length;
  const totalCount = mods.length;
  const encText = doneCount===totalCount ? '今天全完成了，太棒了！'
    : doneCount>0 ? '已完成 '+doneCount+' 项，继续加油！'
    : '今天还没打卡，加油！';

  const inboxHtml = inbox.length ? inbox.slice().reverse().map((x,i)=>{
    const idx=inbox.length-1-i;
    return `<div class="inbox-item"><span>${esc(x.text)}</span><button class="del" onclick="remove('inbox',${idx})">×</button></div>`;
  }).join('') : '<div class="empty">念头丢进来，有空再归位。</div>';

  return `
    <div class="greet">${greet()}，超凡<small>${todayStr()} ${weekday()} · 今年还剩 <b>${daysLeft}</b> 天</small><span class="enc">步履不停，便是得救之法。</span></div>
    <div class="card grad" style="padding:20px 22px">
      <h3 style="font-size:17px;margin-bottom:14px">📋 今日简报</h3>
      <div style="font-size:14px;color:rgba(255,255,255,.9);margin-bottom:8px">已完成 (${doneCount}/${totalCount})</div>
      <div class="brief-grid">${doneMods.join('') || '<span style="color:rgba(255,255,255,.85);font-size:13.5px">今天还没打卡，加油</span>'}</div>
      ${doneCount>0 ? `<div style="margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.85)">${encText}</div>` : ''}
      <div style="font-size:14px;color:rgba(255,255,255,.9);margin:14px 0 8px">待完成 (${totalCount-doneCount})</div>
      <div class="brief-grid">${pendingMods.join('') || '<span style="color:rgba(255,255,255,.6);font-size:13px">全部完成！</span>'}</div>
    </div>
    <div class="card">
      <h3>📥 收容箱</h3>
      ${inboxHtml}
      <div class="add-row">
        <input id="inboxIn" placeholder="" onkeydown="if(event.key==='Enter')addItem('inbox','inboxIn')">
        <button class="btn ghost" onclick="addItem('inbox','inboxIn')">收进来</button>

/* ===== 渲染：读书计划（十年之约） ===== */
function renderRead(){
  const base=readBase();
  const arr=load('read');
  const done=arr.filter(x=>x.done).length;
  const yearRead=base.year+done;
  const readPct=Math.min(100, Math.round(yearRead/52*100));

  const listenArr=load('listen');
  const listenDone=listenArr.filter(x=>x.done).length;
  const yearListen=base.listen+listenDone;
  const listenGoal=base.listenGoal||150;
  const listenPct=Math.min(100, Math.round(yearListen/listenGoal*100));

  const rt=load('readtime');
  const todayRead=rt.find(x=>x.date===ymd());
  const todayMin=todayRead?(+todayRead.min||0):0;

  /* 目标拆解：把 52 本/年 落到 月 / 周 / 日 */
  const now=new Date();
  const yr=now.getFullYear();
  const isLeap=(yr%4===0&&yr%100!==0)||yr%400===0;
  const totalDays=isLeap?366:365;
  const start=new Date(yr,0,1);
  const dayOfYear=Math.floor((now-start)/86400000)+1;
  const daysLeft=totalDays-dayOfYear;
  const shouldBe=Math.round(52*dayOfYear/totalDays);
  const diff=yearRead-shouldBe;
  const booksLeft=Math.max(0,52-yearRead);
  const weeksLeft=Math.max(1,Math.ceil(daysLeft/7));
  const monthsLeft=Math.max(1,daysLeft/30.44);
  const perMonth=Math.ceil(booksLeft/monthsLeft);
  const perWeek=Math.ceil(booksLeft/weeksLeft);
  const perDayMin=booksLeft>0?Math.ceil(booksLeft*480/daysLeft):0;
  const todayPct=perDayMin>0?Math.min(100, Math.round(todayMin/perDayMin*100)):(todayMin>0?100:0);
  const hit = todayMin>=perDayMin && perDayMin>0;
  const paceTxt = diff>0?`<span style="color:var(--green-600);font-weight:600">领先 ${diff} 本</span>`
    : diff<0?`<span style="color:#c08a3e;font-weight:600">落后 ${Math.abs(diff)} 本</span>`
    : `<span style="color:var(--muted)">正好匀速</span>`;

  const readItems = arr.length ? arr.map((x,i)=>`
    <div class="focus-item ${x.done?'done':''}" oncontextmenu="return safeRemove('read',${i},event)">
      <input type="checkbox" ${x.done?'checked':''} onchange="toggle('read',${i})">
      <span>${esc(x.text)}</span>
      <button class="del" onclick="safeRemove('read',${i},event)">×</button>
    </div>`) : [];
  const listenItems = listenArr.length ? listenArr.map((x,i)=>`
    <div class="focus-item ${x.done?'done':''}" oncontextmenu="return safeRemove('listen',${i},event)">
      <input type="checkbox" ${x.done?'checked':''} onchange="toggle('listen',${i})">
      <span>${esc(x.text)}</span>
      <button class="del" onclick="safeRemove('listen',${i},event)">×</button>
    </div>`) : [];

  const READ_LIMIT=3;
  function foldList(items, key){
    if(!items) return '';
    const total=items.length;
    const visible=items.slice(0,READ_LIMIT);
    const hidden=items.slice(READ_LIMIT);
    const html=visible.join('');
    const more=hidden.length?`<div class="fold-toggle" onclick="this.previousElementSibling.style.display='';this.remove()">展开全部 ${total} 本 ▼</div>`:'';
    return `<div>${html}<div style="display:none">${hidden.join('')}</div>${more}</div>`;
  }

  return `
    <div class="greet" style="font-size:20px">📚 读书计划</div>
    <div class="card grad">
      <h3 style="font-size:15px">🌿 十年读书之约 · 第一年进行中</h3>
      <div class="sub" style="margin-top:4px;font-size:13px">每年读书 52 本 · 本年已读 <b>${yearRead}</b> / 52 本</div>
      <div class="bar"><div class="bar-fill" style="width:${readPct}%"></div></div>
      <div class="sub" style="margin-top:6px;font-size:13px;color:rgba(255,255,255,.85)">完成度 <b>${readPct}</b>%</div>
      <div class="sub" style="margin-top:14px;font-size:13px">每年听书 150 本 · 本年已听 <b>${yearListen}</b> / ${listenGoal} 本</div>
      <div class="bar"><div class="bar-fill" style="width:${listenPct}%"></div></div>
      <div class="sub" style="margin-top:6px;font-size:13px;color:rgba(255,255,255,.85)">完成度 <b>${listenPct}</b>%</div>
    </div>
    <div class="card">
      <h3>🎯 目标拆解</h3>
      <div class="module-desc">今年已过 <b>${dayOfYear}</b> 天，匀速应读 <b>${shouldBe}</b> 本，你已读 <b>${yearRead}</b> 本 · ${paceTxt}</div>
      <div class="module-desc" style="margin-top:2px">余下 <b>${daysLeft}</b> 天，还需 <b>${booksLeft}</b> 本。按此节奏：</div>
      <div class="metric-row c3" style="margin-top:12px">
        <div class="metric"><div class="n">${perMonth}</div><div class="l">每月需读（本）</div></div>
        <div class="metric"><div class="n">${perWeek}</div><div class="l">每周需读（本）</div></div>
        <div class="metric"><div class="n">${perDayMin}</div><div class="l">每天需读（分钟）</div></div>
      </div>
    </div>
    <div class="card">
      <h3>📖 今日阅读</h3>
      <div class="module-desc">每日目标 <b>${perDayMin}</b> 分钟 ${hit?'· <span style="color:var(--green-600);font-weight:600">今日已达标 ✓</span>':''}</div>
      <div class="pbar" style="height:10px;margin:10px 0 6px"><div class="pbar-fill" style="width:${todayPct}%"></div></div>
      <div class="module-stat">今日已读 <b>${todayMin}</b> / ${perDayMin} 分钟${hit?' ✓':''}</div>
      <div class="add-row" style="margin-top:12px">
        <input id="rtIn" type="number" inputmode="numeric" placeholder="今日阅读分钟" onkeydown="if(event.key==='Enter')saveReadTime()">
        <button class="btn" onclick="saveReadTime()">记今天</button>
      </div>
      ${arr.length?`<div style="margin-top:16px"><div class="module-desc" style="margin-bottom:8px">已读书单（读完勾选）${arr.length>READ_LIMIT?' · 默认显示前'+READ_LIMIT+'本':''}</div>${foldList(readItems,'read')}</div>`:''}
      <div class="add-row" style="margin-top:10px">
        <input id="modIn" placeholder="读书名，读完就加进来" onkeydown="if(event.key==='Enter')addItem('read','modIn')">
        <button class="btn" onclick="addItem('read','modIn')">添加</button>
      </div>
      ${listenArr.length?`<div style="margin-top:16px"><div class="module-desc" style="margin-bottom:8px">已听书单（听完勾选）${listenArr.length>READ_LIMIT?' · 默认显示前'+READ_LIMIT+'本':''}</div>${foldList(listenItems,'listen')}</div>`:''}
      <div class="add-row" style="margin-top:10px">
        <input id="lisIn" placeholder="听书名，听完就加进来" onkeydown="if(event.key==='Enter')addItem('listen','lisIn')">
        <button class="btn" onclick="addItem('listen','lisIn')">添加</button>
      </div>
    </div>
  `;
}

function readBase(){ const def={year:20,total:72,listen:88,listenGoal:150}; const b=load('read_base'); return (b&&b.year!=null)? {...def,...b} : def; }
function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function streakOf(arr){
  if(!arr||!arr.length) return 0;
  const set=new Set(arr.filter(x=>(+x.min>0||+x.steps>0||+x.stand>0)).map(x=>x.date));
  if(!set.size) return 0;
  let cur=new Date();
  if(!set.has(keyOf(cur))){ cur.setDate(cur.getDate()-1); if(!set.has(keyOf(cur))) return 0; }
  let s=0; while(set.has(keyOf(cur))){ s++; cur.setDate(cur.getDate()-1); }
  return s;
}

      <div style="display:flex;gap:12px;margin-top:14px;font-size:12.5px;color:var(--muted)">
        <span><span style="display:inline-block;width:12px;height:12px;background:linear-gradient(135deg,#86c48c,#5aaf66);border-radius:3px;vertical-align:-1px"></span> 已打卡</span>
        <span><span style="display:inline-block;width:12px;height:12px;background:#f0ede4;border-radius:3px;vertical-align:-1px"></span> 未打卡</span>
        <span style="color:var(--green-600);font-weight:600">● 今天</span>
      </div>
    </div>`;
}
function toggleIdeaDay(d){
  let days=load('idea_days')||[];
  if(days.includes(d)){ days=days.filter(x=>x!==d); }
  else { days.push(d); }
  save('idea_days',days); render();
}

/* ===== 操作 ===== */
function addItem(id, inputId){
  const el=document.getElementById(inputId); if(!el) return;
  const v=el.value.trim(); if(!v) return;
  const arr=load(id); arr.push({id:uid(),text:v,done:false,ts:Date.now()});
  save(id,arr); el.value=''; render();
}
function toggle(id,i){ const arr=load(id); arr[i].done=!arr[i].done; save(id,arr); render(); }
function remove(id,i){ const arr=load(id); arr.splice(i,1); save(id,arr); render(); }
function safeRemove(id, i, e){
  if(e) e.preventDefault();
  const arr=load(id);
  const name = arr[i] ? (arr[i].text || '这一条') : '这一条';
  if(confirm('确定删除「'+name+'」吗？\n\n（已读/已听记录会受影响，进度条会回退）')){
    remove(id, i);
  }
}

/* ===== 路由 ===== */
let current='home';
function render(){
  const m=MODULES.find(x=>x.id===current) || MODULES[0];
  document.getElementById('pageTitle').textContent = m.id==='home' ? '首页' : m.name;
  let html;
  if(m.special) html=dailyBriefing();
  else if(m.id==='read') html=renderRead();
  else if(m.id==='review') html=renderReview();
  else if(m.id==='sport') html=renderSport();
  else if(m.id==='ai') html=renderAI();
  else if(m.id==='doc') html=renderDoc();
  else if(m.id==='idea') html=renderIdea();
  else if(m.id==='good') html=renderGood();
  else if(m.id==='mood') html=renderMood();
  else html=renderModule(m);
  document.getElementById('view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.id===current));
}
function go(id){ current=id; closeDrawer(); render(); window.scrollTo(0,0); }

/* ===== 侧栏 ===== */
function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML = MODULES.map(navItem).join('');
  nav.querySelectorAll('.nav-item').forEach(n=> n.onclick=()=>go(n.dataset.id));
}
function navItem(m){
  return `<div class="nav-item" data-id="${m.id}"><span class="emoji">${m.emoji}</span><span>${esc(m.name)}</span></div>`;
}

/* ===== 移动抽屉 ===== */
function openDrawer(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeDrawer(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

/* ===== 启动 ===== */
document.getElementById('menuBtn').onclick=openDrawer;
document.getElementById('overlay').onclick=closeDrawer;
document.getElementById('topDate').textContent = todayStr()+' '+weekday();
buildNav();
render();

/* PWA */
if('serviceWorker' in navigator){
  const APP_VER=6;
  navigator.serviceWorker.register('sw.js?v='+APP_VER).then(reg=>{
    if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
    reg.onupdatefound=()=>{ const nw=reg.installing; if(nw) nw.onstatechange=()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller) nw.postMessage('SKIP_WAITING'); }; };
  }).catch(()=>{});
  let _reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!_reloaded){ _reloaded=true; location.reload(); } });
}
</script>
